<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060907">
<title>NutriZone — internet yo'q</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(120% 80% at 50% 38%, rgba(29, 78, 216, 0.22), #060907 62%) #060907;
    color: #eef3f0; display: flex; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 380px; text-align: center; padding: 32px 24px 26px; border-radius: 28px;
    background: linear-gradient(165deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
    border: 1px solid rgba(255,255,255,.09); box-shadow: 0 30px 60px -24px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .logo { width: 76px; height: 76px; border-radius: 22px; display: block; margin: 0 auto 18px; box-shadow: 0 14px 30px -10px rgba(29,78,216,.55); }
  .pulse { position: relative; width: 54px; height: 54px; margin: 0 auto 16px; border-radius: 50%; background: rgba(248,113,113,.12); display: grid; place-items: center; }
  .pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(248,113,113,.45); animation: ring 1.8s ease-out infinite; }
  @keyframes ring { from { transform: scale(.8); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
  h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -.01em; }
  p { margin: 0; color: #94a39c; font-size: 14px; line-height: 1.55; }
  .ru { margin-top: 10px; font-size: 12.5px; color: #5c6b64; }
  button {
    margin-top: 22px; width: 100%; border: 0; border-radius: 16px; padding: 14px 18px; font: inherit; font-weight: 700; font-size: 15px;
    color: #fff; background: linear-gradient(155deg, #3b82f6, #1d4ed8); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 12px 26px -10px rgba(59,130,246,.6);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(.98); }
  .status { margin-top: 12px; font-size: 12px; color: #5c6b64; min-height: 1em; }
</style>
</head>
<body>
  <main class="card" role="main">
    <img class="logo" src="/pwa/icon-192.png" alt="NutriZone" width="76" height="76">
    <div class="pulse" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.43"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5a15 15 0 0 1 11.34 3.82"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>Internet aloqasi yo'q</h1>
    <p>Ulanishni tekshiring. Internet qaytishi bilan sahifa o'zi yangilanadi.</p>
    <p class="ru">Нет подключения к интернету — страница обновится сама, когда связь вернётся.</p>
    <button type="button" id="retry">Qayta urinish</button>
    <div class="status" id="status" aria-live="polite"></div>
  </main>
<script>
  (function () {
    var s = document.getElementById("status");
    function go() { s.textContent = "Tekshirilmoqda…"; location.reload(); }
    document.getElementById("retry").addEventListener("click", go);
    window.addEventListener("online", go);
  })();
</script>
</body>
</html>
